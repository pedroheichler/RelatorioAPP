<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RelatorioAPP — Psicologia</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #F7F4EF;
      --surface: #FFFFFF;
      --border: #E0D9CE;
      --text: #1A1714;
      --muted: #8C8479;
      --accent: #3D6B5E;
      --accent-light: #EAF2EF;
      --danger: #C0392B;
      --recording: #E05C3A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      max-width: 720px;
      margin: 0 auto 48px;
    }

    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    header h1 span {
      color: var(--accent);
      font-style: italic;
    }

    header p {
      margin-top: 6px;
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 300;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      max-width: 720px;
      margin: 0 auto 24px;
    }

    .card h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      font-weight: 400;
      margin-bottom: 20px;
      color: var(--text);
    }

    .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 520px) {
      .fields-grid { grid-template-columns: 1fr; }
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    /* ---- Voice area ---- */
    .voice-area {
      border: 1.5px dashed var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-bottom: 16px;
      transition: border-color 0.2s, background 0.2s;
    }

    .voice-area.recording {
      border-color: var(--recording);
      background: #FEF0EC;
    }

    .btn-mic {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 50px;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--accent);
      color: white;
    }

    .btn-mic:hover { opacity: 0.88; }

    .btn-mic.recording {
      background: var(--recording);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(224,92,58,0.4); }
      50% { box-shadow: 0 0 0 10px rgba(224,92,58,0); }
    }

    .mic-icon { font-size: 1.1rem; }

    .transcript-box {
      margin-top: 14px;
      text-align: left;
    }

    .transcript-box textarea {
      min-height: 100px;
      resize: vertical;
      background: white;
    }

    .voice-hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 8px;
    }

    /* ---- API Key ---- */
    .api-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .api-row input { flex: 1; }

    /* ---- Generate button ---- */
    .btn-generate {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: white;
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      font-style: italic;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 4px;
    }

    .btn-generate:hover { opacity: 0.88; }
    .btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ---- Report output ---- */
    #reportCard {
      display: none;
      max-width: 720px;
      margin: 0 auto;
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .report-header h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem;
      font-weight: 400;
    }

    .btn-print {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      color: var(--text);
      transition: background 0.2s;
    }

    .btn-print:hover { background: var(--bg); }

    #reportContent {
      font-size: 0.92rem;
      line-height: 1.75;
      color: var(--text);
    }

    #reportContent h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--accent);
      margin: 20px 0 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--accent-light);
    }

    #reportContent p { margin-bottom: 8px; }

    .report-date-badge {
      display: inline-block;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    /* loading */
    .loading-dots {
      display: inline-flex;
      gap: 5px;
      align-items: center;
    }
    .loading-dots span {
      width: 6px; height: 6px;
      background: white;
      border-radius: 50%;
      animation: bounce 1s infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    .error-msg {
      background: #FEF0EC;
      border: 1px solid #F5C6BB;
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 12px;
    }

    @media print {
      body { background: white; padding: 0; }
      header, .card:not(#reportCard) { display: none; }
      #reportCard { display: block !important; max-width: 100%; }
      .btn-print, .report-header button { display: none; }
      .card { border: none; padding: 0; }
    }
  </style>
</head>
<body>

<header>
  <h1>Relatório<span>App</span></h1>
  <p>Geração de relatórios de sessão com inteligência artificial</p>
</header>

<!-- Dados da sessão -->
<div class="card">
  <h2>Dados da Sessão</h2>
  <div class="fields-grid">
    <div>
      <label>Nome do Paciente</label>
      <input type="text" id="patientName" placeholder="Ex: M.S. (iniciais)" />
    </div>
    <div>
      <label>Data da Sessão</label>
      <input type="date" id="sessionDate" />
    </div>
    <div>
      <label>Número da Sessão</label>
      <input type="number" id="sessionNumber" placeholder="Ex: 12" min="1" />
    </div>
    <div>
      <label>Modalidade</label>
      <select id="modality">
        <option value="presencial">Presencial</option>
        <option value="online">Online</option>
      </select>
    </div>
  </div>
</div>

<!-- Anotações por voz -->
<div class="card">
  <h2>Anotações da Sessão</h2>

  <div class="voice-area" id="voiceArea">
    <button class="btn-mic" id="btnMic" onclick="toggleRecording()">
      <span class="mic-icon">🎙️</span>
      <span id="micLabel">Iniciar gravação</span>
    </button>
    <p class="voice-hint">Fale livremente sobre a sessão. O app transcreve e estrutura o relatório.</p>
  </div>

  <div class="transcript-box">
    <label>Transcrição / Anotações</label>
    <textarea id="transcript" placeholder="A transcrição da voz aparecerá aqui, ou você pode digitar diretamente..."></textarea>
  </div>
</div>

<!-- Gerar -->
<div class="card">
  <div id="errorMsg" class="error-msg" style="display:none;"></div>
  <button class="btn-generate" id="btnGenerate" onclick="generateReport()">
    Gerar Relatório
  </button>
</div>

<!-- Relatório gerado -->
<div class="card" id="reportCard">
  <div class="report-header">
    <h2>Relatório de Sessão</h2>
    <button class="btn-print" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
  </div>
  <div id="reportDateBadge" class="report-date-badge"></div>
  <div id="reportContent"></div>
</div>

<script>
  // Preenche data de hoje por padrão
  document.getElementById('sessionDate').valueAsDate = new Date();

  // ---- Reconhecimento de voz ----
  let recognition = null;
  let isRecording = false;

  function toggleRecording() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      alert('Seu navegador não suporta reconhecimento de voz. Use o Chrome ou Edge.');
      return;
    }

    if (isRecording) {
      recognition.stop();
    } else {
      startRecording();
    }
  }

  function startRecording() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'pt-BR';
    recognition.continuous = true;
    recognition.interimResults = true;

    const textarea = document.getElementById('transcript');
    const baseText = textarea.value;
    let interim = '';

    recognition.onstart = () => {
      isRecording = true;
      document.getElementById('btnMic').classList.add('recording');
      document.getElementById('micLabel').textContent = 'Gravando... (clique para parar)';
      document.getElementById('voiceArea').classList.add('recording');
    };

    recognition.onresult = (e) => {
      let final = '';
      interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
        else interim += e.results[i][0].transcript;
      }
      textarea.value = baseText + final + interim;
    };

    recognition.onend = () => {
      isRecording = false;
      document.getElementById('btnMic').classList.remove('recording');
      document.getElementById('micLabel').textContent = 'Iniciar gravação';
      document.getElementById('voiceArea').classList.remove('recording');
    };

    recognition.start();
  }

  // ---- Gerar relatório via backend ----
  async function generateReport() {
    const transcript = document.getElementById('transcript').value.trim();
    const patientName = document.getElementById('patientName').value.trim() || 'Paciente';
    const sessionDate = document.getElementById('sessionDate').value;
    const sessionNumber = document.getElementById('sessionNumber').value || '—';
    const modality = document.getElementById('modality').value;

    const errorEl = document.getElementById('errorMsg');
    errorEl.style.display = 'none';

    if (!transcript) { showError('Adicione anotações da sessão antes de gerar.'); return; }

    const btn = document.getElementById('btnGenerate');
    btn.disabled = true;
    btn.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>';

    const dateFormatted = sessionDate
      ? new Date(sessionDate + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
      : 'Data não informada';

    try {
      const response = await fetch('/api/relatorio', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ patientName, sessionDate, sessionNumber, modality, transcript })
      });

      const data = await response.json();

      if (!response.ok) throw new Error(data.error || 'Erro no servidor');

      renderReport(data.report, dateFormatted, patientName, sessionNumber);

    } catch (err) {
      showError('Erro ao gerar relatório: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Gerar Relatório';
    }
  }

  function renderReport(markdown, dateStr, patientName, sessionNum) {
    const card = document.getElementById('reportCard');
    const content = document.getElementById('reportContent');
    const badge = document.getElementById('reportDateBadge');

    badge.textContent = `📅 ${dateStr}  ·  Sessão nº ${sessionNum}  ·  ${patientName}`;

    // Converte markdown simples para HTML
    let html = markdown
      .replace(/### (.+)/g, '<h3>$1</h3>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br/>');

    html = '<p>' + html + '</p>';
    content.innerHTML = html;

    card.style.display = 'block';
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }
</script>
</body>
</html>
